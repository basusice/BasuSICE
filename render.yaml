services:
  - type: web
    name: basusice-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: basusice-db
          property: connectionString
      - key: PGSSL
        value: require
      - key: BASUSICE_CORS_ORIGIN
        value: https://basusice.github.io
      - key: BASUSICE_SESSION_HOURS
        value: "168"
      - key: BASUSICE_ADMIN_KEY
        generateValue: true

databases:
  - name: basusice-db
    plan: free
    postgresMajorVersion: "17"
    databaseName: basusice
    user: basusice
