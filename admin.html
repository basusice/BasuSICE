<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel administrativo · BasuSICE</title><style>body{font-family:system-ui;margin:0;background:#f5f8f6;color:#17352a}main{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 8px 24px #17352a12}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.n{font-size:28px;font-weight:900}input,button{padding:11px;border-radius:10px;border:1px solid #cfded5;font:inherit}button{background:#176b4d;color:#fff;border:0}.table{overflow:auto}.data{width:100%;border-collapse:collapse}.data td,.data th{padding:8px;border-bottom:1px solid #e5eee9;text-align:left;white-space:nowrap}.muted{color:#6b7b74}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><main><h1>🌱 BasuSICE · Panel administrativo SICE</h1><p class="muted">Proyecto Verde Esperanza · Semillero SICE</p><div class="card"><label>URL API <input id="api" value="http://localhost:8080"></label> <label>Clave administrativa <input id="key" type="password"></label> <button onclick="loadData()">Consultar</button> <button onclick="exportData()">Exportar JSON</button><p id="status" class="muted"></p></div><div class="grid"><div class="card"><div class="muted">Usuarios</div><div class="n" id="users">0</div></div><div class="card"><div class="muted">Caracterizaciones</div><div class="n" id="regs">0</div></div><div class="card"><div class="muted">Residuos</div><div class="n" id="waste">0</div></div><div class="card"><div class="muted">Peso kg</div><div class="n" id="kg">0</div></div></div><div class="card"><h2>Distribución por fuente</h2><pre id="sources">Sin datos</pre></div><div class="card"><h2>Últimos registros</h2><div class="table"><table class="data"><thead><tr><th>Fecha</th><th>Fuente</th><th>Zona</th><th>Unidades</th><th>kg</th><th>GPS</th><th>Usuario</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>let last=null;function cfg(){return {base:document.getElementById('api').value.replace(/\/$/,''),key:document.getElementById('key').value}}async function loadData(){try{const c=cfg(),r=await fetch(c.base+'/api/admin/summary',{headers:{'X-Admin-Key':c.key}}),j=await r.json();if(!r.ok)throw Error(j.error);last=j;users.textContent=j.users.length;regs.textContent=j.stats.records;waste.textContent=j.stats.waste;kg.textContent=j.stats.kg;sources.textContent=JSON.stringify(j.stats.bySource,null,2);rows.innerHTML=j.records.map(x=>`<tr><td>${x.created?.slice(0,19).replace('T',' ')||''}</td><td>${x.source||''}</td><td>${x.zone||''}</td><td>${x.total||0}</td><td>${Number(x.weightKg||0).toFixed(2)}</td><td>${x.gps?'Sí':'No'}</td><td>${j.users.find(u=>u.id===x.userId)?.name||''}</td></tr>`).join('');status.textContent='✓ Datos actualizados '+new Date().toLocaleTimeString()}catch(e){status.textContent='⚠ '+e.message}}async function exportData(){try{const c=cfg(),r=await fetch(c.base+'/api/admin/export',{headers:{'X-Admin-Key':c.key}}),j=await r.json();if(!r.ok)throw Error(j.error);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(j,null,2)],{type:'application/json'}));a.download='basusice_export.json';a.click()}catch(e){status.textContent='⚠ '+e.message}}</script></body></html>
